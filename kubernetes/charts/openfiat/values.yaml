node:
  image:
    repository: ghcr.io/openfiat-org/openfiat-node
    tag: latest
  replicas: 3
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  service:
    # openfiat-node's real surface (crates/cli's CLI_LISTEN_ADDR/CLI_HTTP_ADDR
    # defaults): QUIC/P2P on UDP, and one HTTP port for JSON-RPC, WebSocket,
    # REST, health, and metrics together — there is no separate metrics port.
    peerPort: 4001
    httpPort: 8080

ingress:
  enabled: false
  host: rpc.openfiat.network
  tls:
    enabled: true
    secretName: openfiat-rpc-tls

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

monitoring:
  serviceMonitor:
    enabled: false
