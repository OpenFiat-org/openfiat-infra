global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  # openfiat-node serves GET /metrics on its one HTTP port (CLI_HTTP_ADDR,
  # default 7080) alongside JSON-RPC/WebSocket/REST/health — there is no
  # separate metrics port.
  - job_name: "openfiat-node"
    static_configs:
      - targets: ["host.docker.internal:7080"]
